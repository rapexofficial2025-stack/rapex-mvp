name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (all workspaces)
        run: pnpm typecheck

      - name: Lint web portals
        run: |
          pnpm --filter admin-portal lint
          pnpm --filter merchant-portal lint
          pnpm --filter provider-portal lint

      - name: Build web portals
        run: |
          pnpm --filter admin-portal build
          pnpm --filter merchant-portal build
          pnpm --filter provider-portal build
