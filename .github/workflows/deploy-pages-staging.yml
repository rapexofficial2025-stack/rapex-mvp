name: Deploy staging (GitHub Pages)

# Auto-deploys on every push to the active dev branch -- Irvin monitors
# staging.rapexmarketplace.store from his phone during work hours (field
# job, no laptop access) and wants it to reflect whatever was just pushed,
# without a separate manual trigger step each time. workflow_dispatch is
# kept too, for an on-demand re-run (e.g. after a Pages/DNS config change
# with no code change). This will fail until GitHub Pages is enabled for
# this repo (Settings -> Pages -> Source: GitHub Actions), which only a
# repo admin can do -- see docs/deployment/README.md. That one-time step
# hasn't happened yet as of this change, so pushes will keep failing until
# it does; not a regression, just still-pending per the manual-actions
# table there.
on:
  push:
    branches: [claude/rapex-deployment-summary-f2nraq]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Base paths are root-relative (/merchant/, not /rapex-mvp/merchant/)
      # because this site is served from a custom domain
      # (staging.rapexmarketplace.store, see the CNAME step below), which
      # serves from its own root -- unlike a default project-page URL
      # (https://<org>.github.io/rapex-mvp/...), which needs the repo-name
      # prefix (a real bug caught and fixed earlier this session, see
      # apps/admin-portal/src/App.tsx's basename comment for the related
      # router fix). If the custom domain is ever removed and this needs to
      # fall back to the default github.io project-page URL, these 5
      # VITE_BASE_PATH/EXPO_WEB_BASE_PATH values need the /rapex-mvp/ prefix
      # added back. Each web portal is verified to typecheck/build clean
      # under this shape before being wired in here.
      - name: Typecheck all apps
        run: pnpm -r --if-present typecheck

      - name: Build admin-portal (/admin/)
        run: pnpm --filter admin-portal build
        env:
          VITE_BASE_PATH: /admin/

      - name: Build merchant-portal (/merchant/)
        run: pnpm --filter merchant-portal build
        env:
          VITE_BASE_PATH: /merchant/

      - name: Build provider-portal (/provider/)
        run: pnpm --filter provider-portal build
        env:
          VITE_BASE_PATH: /provider/

      # customer-app and rider-app are Expo/React Native apps -- exported
      # for web via `expo export -p web` (uses react-native-web, already a
      # dependency of both). experiments.baseUrl in each app.config.js reads
      # EXPO_WEB_BASE_PATH -- verified this session (both apps' typecheck +
      # web export succeed, and the base-path prefix resolves correctly in
      # the exported index.html's favicon/script src) before being wired in
      # here. Rider App's own auth still can't reach real Xano (see
      # docs/api/README.md's rider blocker) -- this deploys it as a
      # navigable scaffold on Mock data, not a functional rider flow.
      - name: Build customer-app (/customer/)
        run: cd apps/customer-app && npx expo export -p web
        env:
          EXPO_WEB_BASE_PATH: /customer

      - name: Build rider-app (/rider/)
        run: cd apps/rider-app && npx expo export -p web
        env:
          EXPO_WEB_BASE_PATH: /rider

      - name: Assemble combined Pages site
        run: |
          mkdir -p site
          cp -r apps/admin-portal/dist site/admin
          cp -r apps/merchant-portal/dist site/merchant
          cp -r apps/provider-portal/dist site/provider
          cp -r apps/customer-app/dist site/customer
          cp -r apps/rider-app/dist site/rider
          # Tells GitHub Pages to serve this deployment on the custom domain
          # instead of only the default <org>.github.io/rapex-mvp/ URL. DNS
          # for staging.rapexmarketplace.store must point at GitHub Pages
          # (a CNAME record to <org>.github.io, set at the registrar --
          # see docs/deployment/README.md) before this actually resolves;
          # this file alone only configures the GitHub side.
          echo "staging.rapexmarketplace.store" > site/CNAME
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><title>RAPEX Staging</title></head>
          <body style="font-family: sans-serif; padding: 2rem;">
            <h1>RAPEX Staging</h1>
            <p>Temporary GitHub Pages deployment -- not the production domain.</p>
            <ul>
              <li><a href="/admin/">Admin Portal</a></li>
              <li><a href="/merchant/">Merchant Portal</a></li>
              <li><a href="/provider/">Provider Portal</a></li>
              <li><a href="/customer/">Customer App (web)</a></li>
              <li><a href="/rider/">Rider App (web scaffold -- auth blocked, see docs/api/README.md)</a></li>
            </ul>
          </body></html>
          HTML

      # KNOWN LIMITATION, documented rather than half-fixed: GitHub Pages
      # only ever consults ONE site-root 404.html for the whole site, never
      # a per-subfolder one -- so a direct load/refresh on a deep link (e.g.
      # /admin/dashboard) will hit GitHub's generic 404, not this app. This
      # doesn't affect normal use: navigating there via in-app links from
      # each app's own /<name>/ root works fine (client-side routing, no
      # full page load). A real fix (a root 404.html that redirects based on
      # path prefix, the "spa-github-pages" pattern) is out of scope for
      # this pass -- flag if deep-link refresh support becomes a real
      # blocker for manual testing.

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
